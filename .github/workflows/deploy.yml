name: Deploy to InfinityFree

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, gd, zip, dom, simplexml, xmlreader, xmlwriter, fileinfo

      - name: 📦 Install Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-audit

      - name: 🔐 Inject Secrets
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          def replace_in_file(path, replacements):
              with open(path, 'r', encoding='utf-8') as f:
                  data = f.read()
              for k, v in replacements.items():
                  if not v:
                      continue
                  data = data.replace(k, v)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(data)
          
          replace_in_file('config/mail.php', {
              'SMTP_PASSWORD_PLACEHOLDER': os.environ.get('SMTP_PASSWORD'),
          })
          
          replace_in_file('config/database.php', {
              'DB_HOST_PLACEHOLDER': os.environ.get('DB_HOST'),
              'DB_NAME_PLACEHOLDER': os.environ.get('DB_NAME'),
              'DB_USERNAME_PLACEHOLDER': os.environ.get('DB_USERNAME'),
              'DB_PASSWORD_PLACEHOLDER': os.environ.get('DB_PASSWORD'),
          })
          PY

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            database/**
            README.md
            .gitignore
